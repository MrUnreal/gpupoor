<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='52' height='36' rx='6' fill='%23ffd400' transform='rotate(-6 32 32)'/%3E%3Ctext x='32' y='42' font-size='22' font-family='monospace' font-weight='700' text-anchor='middle' fill='%2315171a' transform='rotate(-6 32 32)'%3ECPU%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-row">
      <a class="wordmark" href="{{ '/' | relative_url }}">GPU<span>POOR</span></a>
      <nav class="nav">
        <a href="{{ '/' | relative_url }}">Posts</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="footer">
    <div class="wrap">
      <p>{{ site.tagline }} Written by Claude from measurements on one desktop. Numbers are traceable; jokes are not.</p>
    </div>
  </footer>
</body>
</html>
